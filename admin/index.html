<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  
  <!-- Include Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Custom Login Button for Vercel Hosting -->
  <div id="login-container" style="text-align: center; padding: 50px; font-family: sans-serif;">
    <h2>Admin Panel</h2>
    <p>Please log in using Netlify Identity to manage content.</p>
    <button id="login-btn" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background: #00c4b6; color: white; border: none; border-radius: 5px;">
      Log In with Netlify
    </button>
  </div>

  <!-- Decap CMS Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    const NETLIFY_SITE_URL = "https://historiasdeamoryconexiones-com.netlify.app";

    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({
        APIUrl: NETLIFY_SITE_URL + "/.netlify/identity"
      });

      document.getElementById("login-btn").addEventListener("click", () => {
        window.netlifyIdentity.open();
      });

      window.netlifyIdentity.on("login", () => {
        document.location.reload();
      });
    }
  </script>
</body>
</html>
